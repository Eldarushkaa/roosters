services:
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/roosters.sqlite3
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - arena-data:/app/data
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/roosters.sqlite3
    command: ["python", "-m", "roosters.worker"]
    volumes:
      - arena-data:/app/data
    restart: unless-stopped
    init: true

  bot:
    build: .
    profiles: ["telegram"]
    env_file: .env
    command: ["python", "-m", "scripts.bot"]
    restart: unless-stopped
    init: true

volumes:
  arena-data:
